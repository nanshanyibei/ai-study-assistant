# 阶段二启用的中间件：向量库 + 会话缓存
# 当前 MVP 不依赖，跑通对话链路后再启动
services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: study-pgvector
    environment:
      POSTGRES_DB: study
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: study-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
